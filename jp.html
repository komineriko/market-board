<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>MY MARKET BOARD JP</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #111722;
    --line: #1e2735;
    --text: #e8edf4;
    --dim: #8a97a8;
    --accent: #5ec2ff;
    --up: #26c281;
    --down: #ff5252;
    --tabbar-h: 58px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    overscroll-behavior: none;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, #131b28, #0d1320);
    border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 10px) 14px 8px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 {
    font-size: 15px; letter-spacing: 0.14em; font-weight: 800;
    color: var(--accent);
  }
  header .date { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  header .reload {
    background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 6px; font-size: 11px; padding: 3px 8px; margin-left: 8px;
  }
  header a.us {
    color: var(--dim); font-size: 11px; text-decoration: none;
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; margin-left: 6px;
  }
  main {
    padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 8px);
  }
  .ticker { border-bottom: 1px solid var(--line); }
  section.pane { display: none; padding: 10px 8px 20px; }
  section.pane.active { display: block; }
  .pane h2 {
    font-size: 12px; color: var(--dim); font-weight: 600;
    letter-spacing: 0.08em; margin: 6px 4px 10px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
  }
  .tall { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }

  .watch-add {
    display: flex; gap: 8px; margin: 4px 4px 14px;
  }
  .watch-add input {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text); font-size: 14px; padding: 10px 12px;
  }
  .watch-add input::placeholder { color: #5a6678; }
  .watch-add button {
    background: var(--accent); color: #0a1420; font-weight: 700;
    border: none; border-radius: 8px; font-size: 14px; padding: 0 18px;
  }
  .watch-item { margin-bottom: 14px; }
  .watch-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px 6px;
  }
  .watch-head .sym { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
  .watch-head .meta { font-size: 11px; color: var(--dim); }
  .watch-head .del {
    background: none; border: 1px solid var(--line); color: var(--down);
    border-radius: 6px; font-size: 11px; padding: 3px 10px; margin-left: 10px;
  }
  .empty {
    text-align: center; color: var(--dim); font-size: 13px;
    padding: 40px 20px; line-height: 1.8;
  }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #0d1320; border-top: 2px solid var(--accent);
    display: flex;
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: none; color: var(--dim);
    font-family: inherit; font-size: 10px; line-height: 1.3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
  }
  nav button .no {
    font-size: 11px; font-weight: 800; font-style: italic;
    color: #4a5568; font-family: Georgia, serif;
  }
  nav button.on { color: var(--text); }
  nav button.on .no { color: var(--accent); }
  .tv-wrap { min-height: 60px; }
</style>
</head>
<body>

<header>
  <h1>MY MARKET BOARD JP</h1>
  <div>
    <span class="date" id="nowDate"></span>
    <a class="us" href="./">US版</a>
    <button class="reload" onclick="location.reload()">更新</button>
  </div>
</header>

<div class="ticker" id="tickerTape"></div>

<main>
  <section class="pane active" id="pane-summary">
    <h2>1 ｜ サマリー（日本市場）</h2>
    <div class="grid2" id="summaryGrid"></div>
  </section>

  <section class="pane" id="pane-heatmap">
    <h2>2 ｜ 日本株スクリーナー（前日比）</h2>
    <div class="tall" id="heatmapBox" style="height:72vh"></div>
  </section>

  <section class="pane" id="pane-sector">
    <h2>3 ｜ 業種別ETF TOPIX-17（前日比）</h2>
    <div class="tall" id="sectorBox"></div>
  </section>

  <section class="pane" id="pane-news">
    <h2>4 ｜ マーケットニュース</h2>
    <div class="tall" id="newsBox" style="height:72vh"></div>
  </section>

  <section class="pane" id="pane-watch">
    <h2>5 ｜ 注目チャート（自分で追加）</h2>
    <div class="watch-add">
      <input id="symInput" placeholder="例: TSE:7203 / TSE:8035" autocapitalize="characters" autocomplete="off">
      <button onclick="addSymbol()">追加</button>
    </div>
    <div id="watchList"></div>
  </section>
</main>

<nav>
  <button class="on" data-pane="summary"><span class="no">1</span>サマリー</button>
  <button data-pane="heatmap"><span class="no">2</span>ヒートマップ</button>
  <button data-pane="sector"><span class="no">3</span>セクター</button>
  <button data-pane="news"><span class="no">4</span>ニュース</button>
  <button data-pane="watch"><span class="no">5</span>注目</button>
</nav>

<script>
/* ============ 共通: TradingViewウィジェット生成 ============ */
function tvWidget(container, embedName, config, height) {
  const wrap = document.createElement("div");
  wrap.className = "tradingview-widget-container tv-wrap";
  if (height) wrap.style.height = height;
  const inner = document.createElement("div");
  inner.className = "tradingview-widget-container__widget";
  if (height) inner.style.height = "100%";
  wrap.appendChild(inner);
  const s = document.createElement("script");
  s.type = "text/javascript";
  s.async = true;
  s.src = "https://s3.tradingview.com/external-embedding/embed-widget-" + embedName + ".js";
  s.innerHTML = JSON.stringify(config);
  wrap.appendChild(s);
  container.appendChild(wrap);
}

/* ============ 日付表示 ============ */
function pad(n){ return String(n).padStart(2,"0"); }
function showDate(){
  const d = new Date();
  const w = ["日","月","火","水","木","金","土"][d.getDay()];
  document.getElementById("nowDate").textContent =
    `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}(${w}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
showDate();
setInterval(showDate, 30000);

/* ============ ティッカーテープ ============ */
tvWidget(document.getElementById("tickerTape"), "ticker-tape", {
  symbols: [
{proName:"FX_IDC:USDJPY", title:"ドル円"},
    {proName:"AMEX:EWJ", title:"日本株ETF"},
    {proName:"TSE:7203", title:"トヨタ"},
    {proName:"TSE:8035", title:"東エレク"},
    {proName:"TSE:6857", title:"アドテスト"},
    {proName:"TSE:9984", title:"ソフトバンクG"},
    {proName:"TSE:8306", title:"三菱UFJ"},
    {proName:"TSE:9432", title:"NTT"}
  ],
  showSymbolLogo: false, isTransparent: true,
  displayMode: "adaptive", colorTheme: "dark", locale: "ja"
});

/* ============ タブ制御(遅延ロード) ============ */
const loaded = { summary:false, heatmap:false, sector:false, news:false, watch:false };
document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    document.querySelectorAll("section.pane").forEach(p => p.classList.remove("active"));
    const id = btn.dataset.pane;
    document.getElementById("pane-" + id).classList.add("active");
    loadPane(id);
    window.scrollTo(0, 0);
  });
});

function loadPane(id){
  if (loaded[id]) return;
  loaded[id] = true;
  if (id === "summary") {
    const g = document.getElementById("summaryGrid");
    [
      ["FX_IDC:USDJPY","ドル円"], ["AMEX:EWJ","日本株ETF(米国上場)"],
      ["TSE:7203","トヨタ自動車"], ["TSE:8035","東京エレクトロン"],
      ["TSE:6857","アドバンテスト"], ["TSE:9984","ソフトバンクG"],
      ["TSE:8306","三菱UFJフィナンシャル"], ["TSE:9432","NTT"]
    ].forEach(([sym]) => {
      const card = document.createElement("div");
      card.className = "card";
      g.appendChild(card);
      tvWidget(card, "mini-symbol-overview", {
        symbol: sym, width: "100%", height: 200,
        locale: "ja", dateRange: "3M", colorTheme: "dark",
        isTransparent: true, autosize: false, chartOnly: false
      });
    });
  }
  if (id === "heatmap") {
    tvWidget(document.getElementById("heatmapBox"), "screener", {
      width: "100%", height: "100%", defaultColumn: "overview",
      defaultScreen: "change", showToolbar: true, locale: "ja",
      market: "japan", colorTheme: "dark", isTransparent: true
    }, "100%");
  }
  if (id === "sector") {
    tvWidget(document.getElementById("sectorBox"), "market-quotes", {
      width: "100%", height: 760, isTransparent: true,
      colorTheme: "dark", locale: "ja", showSymbolLogo: false,
      symbolsGroups: [{
        name: "TOPIX-17 業種別ETF",
        symbols: [
          {name:"TSE:1625", displayName:"1625 電機・精密"},
          {name:"TSE:1626", displayName:"1626 情報通信・サービス"},
          {name:"TSE:1622", displayName:"1622 自動車・輸送機"},
          {name:"TSE:1631", displayName:"1631 銀行"},
          {name:"TSE:1632", displayName:"1632 金融(除く銀行)"},
          {name:"TSE:1629", displayName:"1629 商社・卸売"},
          {name:"TSE:1624", displayName:"1624 機械"},
          {name:"TSE:1620", displayName:"1620 素材・化学"},
          {name:"TSE:1621", displayName:"1621 医薬品"},
          {name:"TSE:1617", displayName:"1617 食品"},
          {name:"TSE:1630", displayName:"1630 小売"},
          {name:"TSE:1628", displayName:"1628 運輸・物流"},
          {name:"TSE:1623", displayName:"1623 鉄鋼・非鉄"},
          {name:"TSE:1619", displayName:"1619 建設・資材"},
          {name:"TSE:1618", displayName:"1618 エネルギー資源"},
          {name:"TSE:1627", displayName:"1627 電力・ガス"},
          {name:"TSE:1633", displayName:"1633 不動産"}
        ]
      }]
    });
  }
  if (id === "news") {
    tvWidget(document.getElementById("newsBox"), "timeline", {
      feedMode: "symbol", symbol: "TVC:NI225", isTransparent: true,
      displayMode: "regular", colorTheme: "dark", locale: "ja",
      width: "100%", height: "100%"
    }, "100%");
  }
  if (id === "watch") renderWatch();
}

/* ============ 注目チャート(localStorage/日本株版は別キー) ============ */
const WKEY = "watchChartsJP_v1";
function getWatch(){
  try { return JSON.parse(localStorage.getItem(WKEY)) || []; }
  catch(e){ return []; }
}
function setWatch(list){ localStorage.setItem(WKEY, JSON.stringify(list)); }

function addSymbol(){
  const inp = document.getElementById("symInput");
  let sym = inp.value.trim().toUpperCase();
  if (!sym) return;
  if (/^[0-9]{4}[A-Z]?$/.test(sym)) sym = "TSE:" + sym;
  const list = getWatch();
  if (list.some(x => x.s === sym)) { inp.value = ""; return; }
  const d = new Date();
  list.unshift({ s: sym, d: `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}` });
  setWatch(list);
  inp.value = "";
  renderWatch();
}

function removeSymbol(sym){
  setWatch(getWatch().filter(x => x.s !== sym));
  renderWatch();
}
function renderWatch(){
  const box = document.getElementById("watchList");
  box.innerHTML = "";
  const list = getWatch();
  if (!list.length) {
    box.innerHTML = '<div class="empty">まだ登録がありません。<br>上の欄に銘柄コードを入力して「追加」<br>（例: 7203 / 8035 ※4桁だけでもOK）</div>';
    return;
  }

  function renderOne(index){
    if (index >= list.length) return;
    const item = list[index];
    const wrap = document.createElement("div");
    wrap.className = "watch-item";
    const head = document.createElement("div");
    head.className = "watch-head";
    head.innerHTML = `<span class="sym">${item.s}</span>
      <span class="meta">${item.d} 追加
        <button class="del" onclick="removeSymbol('${item.s}')">削除</button></span>`;
    wrap.appendChild(head);
    const chart = document.createElement("div");
    chart.className = "tall";
    chart.style.height = "560px";
    wrap.appendChild(chart);
    box.appendChild(wrap);

    const cid = "tvw_jp_" + index + "_" + Date.now();
    const inner = document.createElement("div");
    inner.className = "tradingview-widget-container__widget";
    inner.style.height = "100%";
    inner.id = cid;
    const wrapDiv = document.createElement("div");
    wrapDiv.className = "tradingview-widget-container tv-wrap";
    wrapDiv.style.height = "100%";
    wrapDiv.appendChild(inner);
    chart.appendChild(wrapDiv);

    const s = document.createElement("script");
    s.type = "text/javascript";
    s.async = true;
    s.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
    s.innerHTML = JSON.stringify({
      container_id: cid,
      symbol: item.s, interval: "D", timezone: "Asia/Tokyo",
      theme: "dark", style: "1", locale: "ja",
      hide_side_toolbar: true, hide_top_toolbar: false,
      allow_symbol_change: false, save_image: false,
      withdateranges: true, autosize: true,
      support_host: "https://www.tradingview.com",
      studies: ["MACD@tv-basicstudies", "RSI@tv-basicstudies"]
    });
    let advanced = false;
    const goNext = () => { if (!advanced) { advanced = true; renderOne(index + 1); } };
    s.onload = () => setTimeout(goNext, 500);
    s.onerror = goNext;
    wrapDiv.appendChild(s);
    setTimeout(goNext, 1800);
  }

  renderOne(0);
}

/* ============ 毎日16:00 自動リロード(日本株版) ============ */
const RKEY = "lastAutoReloadJP";
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
setInterval(() => {
  const d = new Date();
  const mins = d.getHours() * 60 + d.getMinutes();
  if (mins >= 960 && mins <= 990 && localStorage.getItem(RKEY) !== todayStr()) {
    localStorage.setItem(RKEY, todayStr());
    location.reload();
  }
}, 20000);

/* 初期タブロード */
loadPane("summary");
</script>
</body>
</html>
